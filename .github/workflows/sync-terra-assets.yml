name: Incorporar recursos publicos del visor TERRA

on:
  push:
    branches:
      - feature/terra-visor-integrado
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importar:
    if: github.ref == 'refs/heads/feature/terra-visor-integrado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descargar recursos originales y comprobar SHA-256
        run: node scripts/import-terra-visor.mjs
      - name: Incorporar los archivos a la rama del Pull Request
        shell: bash
        run: |
          git add public/terra/estado
          if git diff --cached --quiet; then
            echo "Los cinco recursos ya estan incorporados; no hay cambios."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Incorporar archivos publicos originales del visor TERRA"
          git push origin HEAD:feature/terra-visor-integrado
